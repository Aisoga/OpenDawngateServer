# Builds and tests everything that runs without the game, and builds the release zip and the
# Linux server's archive. The server's Go code is also tested and built on Linux, and the Linux
# archive is checked there.
# A successful build of main (every job green) replaces the rolling "nightly" pre-release (never marked Latest).
# A pushed tag v<major>.<minor>[.<patch>] on a commit of main builds the same way, with the tag as the
# release's name and version, and publishes the numbered release <tag> with <tag>.zip and <tag>-linux.tar.gz.
# A numbered release's Windows programs are signed by the maintainer (README.md *Code signing policy*,
# docs/development/signing.md) once the repository variable SIGN_RELEASES is true: then the tag's push run builds and
# tests the release without publishing it and keeps the three programs as its artifact to-sign;
# re/scripts/sign_release.ps1 signs them on the maintainer's PC (the Certum certificate), puts them into the tag's
# draft release and starts a second run on the tag (workflow_dispatch, unsigned_run = the first run's id), which
# takes the first run's dgsim.dll, builds the programs again, checks that each signed file is its own build's file
# plus a valid signature (make_release.ps1 -SignedFiles), packs the archives and publishes the draft. Without
# SIGN_RELEASES, and for every other build, the programs stay unsigned.
# Nothing here needs the game's files: tests that read them skip themselves.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC: catches changes in the runner's toolchain
  workflow_dispatch:
    inputs:
      unsigned_run:
        description: 'A signed release (re/scripts/sign_release.ps1 starts it on the tag): the id of the tag push run whose programs were signed; empty for an ordinary build'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # a signed release's second run: the id of the tag's push run whose programs the maintainer signed
  UNSIGNED_RUN: ${{ inputs.unsigned_run }}
  RAKNET_COMMIT: 1a169895a900c9fc4841c556e16514182b75faf8
  RAKNET_SHA256: 60b53557aa084fb5455c8e2e7efe309738dabe7f9db5c0bc103cf41c8f97c0e0
  LUAJ_SHA256: 02464b0a6cf90fa404d0b62ebb587b96a38e118420a7adc467c1550f889fa41b

jobs:
  signed-files:
    # a signed release's second run: the three programs the maintainer signed, from the tag's draft release
    # (re/scripts/sign_release.ps1 uploads them there), handed to the build job as this run's artifact signed.
    # Its own job: reading a draft release takes write access, which the build job doesn't get
    if: github.repository == 'Aisoga/OpenDawngateServer' && inputs.unsigned_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: The signed programs (the tag's draft release)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in refs/tags/v*) ;; *) echo "::error::a signed release runs on its tag, not on $GITHUB_REF"; exit 1 ;; esac
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::release $TAG is not a draft: re/scripts/sign_release.ps1 makes the draft with the signed programs"; exit 1
          fi
          mkdir signed
          gh release download "$TAG" --repo "$REPO" --dir signed --pattern Start-Server.exe --pattern Start-Client.exe --pattern dgsim.dll
          ls -l signed
          [ "$(ls signed | wc -l)" -eq 3 ] || { echo "::error::the draft $TAG lacks one of Start-Server.exe, Start-Client.exe, dgsim.dll"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: signed/
          if-no-files-found: error
          retention-days: 1

  build:
    # only in the public repository (a private copy of this file runs nothing); after signed-files in a signed
    # release's second run, on its own in every other
    needs: signed-files
    if: github.repository == 'Aisoga/OpenDawngateServer' && !cancelled() && needs.signed-files.result != 'failure'
    runs-on: windows-2022 # Visual Studio 2022 with its x86 compiler and CMake
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # a signed release's second run: the first run's artifact match-host
    outputs:
      signed: ${{ steps.release.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release name (a version tag)
        # a tag v* names the release (and its version); its form is checked before anything is built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') {
            throw "tag $env:GITHUB_REF_NAME`: a release tag is v<major>.<minor> or v<major>.<minor>.<patch> (e.g. v0.6, v1.0.1)"
          }
          "RELEASE_NAME=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV

      - name: Signed release (the first run)
        # the second run's input: a successful push run of this workflow on this tag's commit
        if: env.UNSIGNED_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:RELEASE_NAME) { throw "a signed release runs on its version tag, not on $env:GITHUB_REF" }
          if ($env:UNSIGNED_RUN -notmatch '^[0-9]+$') { throw "unsigned_run $env:UNSIGNED_RUN is not a run id" }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:UNSIGNED_RUN" | ConvertFrom-Json
          $self = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | ConvertFrom-Json
          $want = [ordered]@{ workflow_id = $self.workflow_id; event = 'push'; head_sha = $env:GITHUB_SHA; head_branch = $env:GITHUB_REF_NAME; conclusion = 'success' }
          foreach ($k in $want.Keys) { if ($run.$k -ne $want[$k]) { throw "run $env:UNSIGNED_RUN`: $k is '$($run.$k)', not '$($want[$k])'" } }
          "the programs signed from run $env:UNSIGNED_RUN ($($run.html_url))"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: RakNet 4.081 (cache)
        id: raknet-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/raknet/RakNet
          key: raknet-${{ env.RAKNET_COMMIT }}

      - name: RakNet 4.081 (download, check, unpack)
        if: steps.raknet-cache.outputs.cache-hit != 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Join-Path $env:RUNNER_TEMP 'raknet.zip'
          Invoke-WebRequest "https://github.com/facebookarchive/RakNet/archive/$env:RAKNET_COMMIT.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:RAKNET_SHA256) { throw "RakNet archive SHA-256 $got, expected $env:RAKNET_SHA256" }
          $tmp = Join-Path $env:RUNNER_TEMP 'raknet'
          Expand-Archive $zip -DestinationPath $tmp
          New-Item -ItemType Directory -Force tools/raknet | Out-Null
          Move-Item (Join-Path $tmp "RakNet-$env:RAKNET_COMMIT") tools/raknet/RakNet

      # a signed release's second run builds only the programs: the first run tested this commit and built its dgsim.dll
      - name: Go (format, vet, tests)
        if: env.UNSIGNED_RUN == ''
        working-directory: server
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $unformatted = gofmt -l .
          if ($unformatted) { $unformatted; throw 'gofmt: the files above are not formatted' }
          go vet ./...
          go test ./...

      - name: Match host (build)
        if: env.UNSIGNED_RUN == ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S gms -B gms/build -G "Visual Studio 17 2022" -A Win32 "-DRAKNET_ROOT=$env:GITHUB_WORKSPACE/tools/raknet/RakNet"
          cmake --build gms/build --config Release

      - name: Match host (tests)
        if: env.UNSIGNED_RUN == ''
        run: |
          # The RakNet loopback session tests fail now and then on a busy machine (about 1 run in 8):
          # one retry, flagged in the run's summary, so a single slow run doesn't turn the build red.
          gms/build/Release/gms_tests.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning title=gms_tests::gms_tests failed once and is run again (a known flaky loopback test)'
            gms/build/Release/gms_tests.exe
            if ($LASTEXITCODE -ne 0) { throw 'gms_tests failed twice' }
          }
          $PSNativeCommandUseErrorActionPreference = $true
          gms/build/core/control/Release/dg_control_tests.exe

      - name: Match host Lua (LuaJ check)
        if: env.UNSIGNED_RUN == ''
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force tools/luaj | Out-Null
          $jar = 'tools/luaj/luaj-jse-2.0.3.jar'
          Invoke-WebRequest 'https://repo1.maven.org/maven2/org/luaj/luaj-jse/2.0.3/luaj-jse-2.0.3.jar' -OutFile $jar
          $got = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LUAJ_SHA256) { throw "LuaJ SHA-256 $got, expected $env:LUAJ_SHA256" }
          python -I re/scripts/bots_lua_check.py --java "$env:JAVA_HOME_21_X64\bin\java.exe" --luaj $jar

      # a signed release's second run: the first run's dgsim.dll with its build stamp (make_release.ps1 takes it as
      # current: the stamp names its bytes, both are newer than the checkout) and the signed programs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.UNSIGNED_RUN != ''
        with:
          name: match-host
          path: gms/build/Release
          run-id: ${{ env.UNSIGNED_RUN }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.UNSIGNED_RUN != ''
        with:
          name: signed
          path: re/out/signed

      - name: Release zip and Linux archive
        id: release
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # a tag's build is named after the tag; any other build OpenDawngateServer-<date>-<commit>. A signed
          # release's second run takes the signed programs: make_release.ps1 -SignedFiles checks that each is this
          # build's file plus a valid, timestamped signature, and BUILD.txt lists them (Start-Client's update checks them)
          $nameArgs = @()
          if ($env:RELEASE_NAME) { $nameArgs = @('-Name', $env:RELEASE_NAME) }
          if ($env:UNSIGNED_RUN) { $nameArgs += @('-SignedFiles', 're/out/signed') }
          powershell -NoProfile -ExecutionPolicy Bypass -File re/scripts/make_release.ps1 @nameArgs
          $zip = @(Get-ChildItem re/out/release -Filter '*.zip')
          if ($zip.Count -ne 1) { throw "expected one release zip, found $($zip.Count)" }
          $tgz = @(Get-ChildItem re/out/release -Filter '*-linux.tar.gz')
          if ($tgz.Count -ne 1) { throw "expected one Linux archive, found $($tgz.Count)" }
          if ($env:RELEASE_NAME -and $zip[0].Name -cne "$env:RELEASE_NAME.zip") { throw "the zip is $($zip[0].Name), not $env:RELEASE_NAME.zip" }
          "RELEASE_ZIP=$($zip[0].FullName)" >> $env:GITHUB_ENV
          "RELEASE_TGZ=$($tgz[0].FullName)" >> $env:GITHUB_ENV
          if ($env:UNSIGNED_RUN) { "signed=true" >> $env:GITHUB_OUTPUT }

      # Code signing (README.md *Code signing policy*): with SIGN_RELEASES, a tag's push run keeps the three programs
      # for the maintainer (to-sign) and its dgsim.dll for the second run (match-host), and publishes nothing
      - name: Files to sign
        id: to-sign
        if: env.RELEASE_NAME != '' && env.UNSIGNED_RUN == '' && github.event_name == 'push' && vars.SIGN_RELEASES == 'true'
        run: |
          $d = "re/out/release/$env:RELEASE_NAME"
          New-Item -ItemType Directory -Force re/out/to-sign, re/out/match-host | Out-Null
          Copy-Item "$d/Start-Server.exe", "$d/Start-Client.exe", "$d/host/dgsim.dll" re/out/to-sign
          Copy-Item gms/build/Release/dgsim.dll, gms/build/Release/dgsim.dll.stamp re/out/match-host
          Get-ChildItem re/out/to-sign, re/out/match-host
          @(
            "### $env:RELEASE_NAME waits for its signature",
            "On the maintainer's PC, with SimplySign Desktop connected: ``powershell -ExecutionPolicy Bypass -File re\scripts\sign_release.ps1 -Tag $env:RELEASE_NAME``",
            "(within 14 days, while this run's artifacts are kept)."
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.to-sign.outcome == 'success'
        with:
          name: to-sign
          path: re/out/to-sign/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.to-sign.outcome == 'success'
        with:
          name: match-host
          path: re/out/match-host/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_TGZ }}
          if-no-files-found: error
          retention-days: 14

  linux:
    # the server's Go code on Linux: format, vet, tests, and the Linux programs
    # (Start-Client stays Windows-only: it starts the Windows game)
    if: github.repository == 'Aisoga/OpenDawngateServer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Go (format, vet, tests)
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo '::error::gofmt: the files above are not formatted'; exit 1; fi
          go vet ./...
          go test ./...

      - name: Linux programs (build)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-amd64"
          go build -trimpath -ldflags '-s -w' -o "$out/" ./cmd/dgserver ./cmd/start-server
          ls -l "$out"

  linux-release:
    # the Linux archive the Windows job built: one top folder, owner 0:0, the modes and the files
    # of the layout, LF texts, every file's SHA-256 as BUILD.txt lists it, and start-server runs
    # here with the release's version
    needs: build
    if: github.repository == 'Aisoga/OpenDawngateServer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Linux archive (layout, modes, start-server)
        run: |
          set -euo pipefail
          zip=$(ls release/*.zip)
          tgz=$(ls release/*-linux.tar.gz)
          name=$(basename "$zip" .zip)
          if [ "$(basename "$tgz")" != "$name-linux.tar.gz" ]; then echo "::error::$tgz is not $name-linux.tar.gz"; exit 1; fi
          tar -tvzf "$tgz" --numeric-owner > listing.txt
          grep -v '/host/lua/' listing.txt
          echo "$(grep -c '/host/lua/.*\.lua$' listing.txt) Lua scripts in host/lua"
          awk -v top="$name-linux/" '
            { mode = $1; own = $2; path = $NF
              if (own != "0/0") { print "::error::owner " own ": " path; bad = 1 }
              if (index(path, top) != 1) { print "::error::outside " top ": " path; bad = 1; next }
              rel = substr(path, length(top) + 1)
              if (mode ~ /^d/) want = "drwxr-xr-x"; else if (rel == "start-server") want = "-rwxr-xr-x"; else want = "-rw-r--r--"
              if (mode != want) { print "::error::mode " mode " (not " want "): " path; bad = 1 }
              if (mode !~ /^d/ && rel !~ /^(start-server|dawngate\.service|README\.txt|LICENSE\.txt|THIRD-PARTY-NOTICES\.txt|BUILD\.txt|maps\/README\.txt|host\/dgsim\.dll|host\/lua\/[A-Za-z0-9_]+\.lua)$/) { print "::error::not a file of the layout: " path; bad = 1 }
            }
            END { exit bad }' listing.txt
          mkdir unpacked
          tar xzf "$tgz" -C unpacked --strip-components=1
          cd unpacked
          version=$(./start-server --version)
          if [ "$version" != "$name" ]; then echo "::error::start-server --version says $version, not $name"; exit 1; fi
          sed -n '/^SHA-256 of the files:$/,$p' BUILD.txt | tail -n +2 | sha256sum -c --quiet
          for f in README.txt dawngate.service LICENSE.txt THIRD-PARTY-NOTICES.txt BUILD.txt maps/README.txt; do
            if grep -q $'\r' "$f"; then echo "::error::$f has CR line ends"; exit 1; fi
          done
          echo "the Linux archive of $name: layout, modes and owner as specified, start-server $version"

  nightly:
    # a build of main (a push or the weekly run) replaces the rolling pre-release,
    # only when the Linux jobs passed too
    needs: [build, linux, linux-release]
    if: github.repository == 'Aisoga/OpenDawngateServer' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip=$(ls release/*.zip)
          tgz=$(ls release/*-linux.tar.gz)
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          cat > notes.md <<EOF
          An automatic build of commit ${SHA}, made by this repository's build workflow.

          - Unsigned and not tested in the game: the stable versions are the numbered releases ([Code signing policy](https://github.com/${REPO}#code-signing-policy)).
          - Like every release it contains no game file: put your own \`Dawngate.zip\` (archive.org) next to \`Start-Server.exe\`.
          - The \`-linux.tar.gz\` archive is the same server for a 64-bit Linux machine (\`start-server\`, its match hosts under Wine); players use the zip's \`Start-Client.exe\`.
          - \`BUILD.txt\` in each archive names the commit it was built from (the source, AGPL-3.0).

          This pre-release is replaced by the next build.
          EOF
          gh release create nightly "$zip" "$tgz" --repo "$REPO" --target "$SHA" --prerelease --latest=false \
            --title "Nightly build $(date -u +%Y-%m-%d) (${SHA:0:10})" --notes-file notes.md

  release:
    # a version tag (v<major>.<minor>[.<patch>], checked by the build job) on a commit of main publishes the
    # numbered release: the tag's name as its title and its files' names, not a pre-release, marked Latest by
    # GitHub's rule (the newest version). Without SIGN_RELEASES the tag's push run publishes it unsigned; with it the
    # second run (sign_release.ps1's) completes the draft that holds the signed programs: the archives in, the three
    # loose programs out, then published. A published release is never replaced
    needs: [build, linux, linux-release]
    if: >-
      github.repository == 'Aisoga/OpenDawngateServer' && startsWith(github.ref, 'refs/tags/v') &&
      ((github.event_name == 'push' && vars.SIGN_RELEASES != 'true') || (github.event_name == 'workflow_dispatch' && inputs.unsigned_run != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          policy="[Code signing policy](https://github.com/${REPO}#code-signing-policy)"
          if [ "$SIGNED" = true ]; then
            signing="- The Windows programs are signed with the maintainer's Certum Open Source Code Signing certificate (${policy})."
          else
            signing="- The programs are unsigned (SmartScreen: *More info*, *Run anyway*; ${policy})."
          fi
          zip="release/$TAG.zip"
          tgz="release/$TAG-linux.tar.gz"
          ls -l "$zip" "$tgz"
          # the tag must be on main: a release is built only from the published history
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::tag $TAG ($SHA) is not on main (compare: $status); push main first, then the tag"; exit 1
          fi
          cat > notes.md <<NOTES
          OpenDawngateServer ${TAG}, built by this repository's build workflow from commit ${SHA}.

          - \`${TAG}.zip\`: Windows 10/11 64-bit. \`Start-Server.exe\` runs a server, \`Start-Client.exe\` plays. Put your own \`Dawngate.zip\` (archive.org) next to \`Start-Server.exe\`; the release contains no game file. See \`README.txt\` in the zip.
          - \`${TAG}-linux.tar.gz\`: the same server for a 64-bit Linux machine (\`start-server\`, its match hosts under Wine).
          - Players and servers play together only on the same release: update both to this one.
          ${signing}
          - \`BUILD.txt\` in each archive names the commit it was built from (the source, AGPL-3.0).
          NOTES
          if [ "$SIGNED" = true ]; then
            # the draft sign_release.ps1 made with the signed programs
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::release $TAG is not a draft (already published?)"; exit 1
            fi
            gh release upload "$TAG" "$zip" "$tgz" --repo "$REPO" --clobber
            for f in Start-Server.exe Start-Client.exe dgsim.dll; do gh release delete-asset "$TAG" "$f" --repo "$REPO" --yes; done
            gh release edit "$TAG" --repo "$REPO" --title "OpenDawngateServer $TAG" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" "$zip" "$tgz" --repo "$REPO" --verify-tag \
              --title "OpenDawngateServer $TAG" --notes-file notes.md
          fi

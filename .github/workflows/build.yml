# Builds and tests everything that runs without the game, and builds the release zip and the
# Linux server's archive. The server's Go code is also tested and built on Linux, and the Linux
# archive is checked there.
# A successful build of main (every job green) replaces the rolling "nightly" pre-release (never marked Latest).
# A pushed tag v<major>.<minor>[.<patch>] on a commit of main builds the same way, with the tag as the
# release's name and version, and publishes the numbered release <tag> with <tag>.zip and <tag>-linux.tar.gz.
# A numbered release's Windows programs are signed through SignPath once the repository has its settings
# (README.md *Code signing policy*; the steps after "Release zip and Linux archive"); until then, and for every
# other build, they stay unsigned.
# Nothing here needs the game's files: tests that read them skip themselves.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC: catches changes in the runner's toolchain
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  RAKNET_COMMIT: 1a169895a900c9fc4841c556e16514182b75faf8
  RAKNET_SHA256: 60b53557aa084fb5455c8e2e7efe309738dabe7f9db5c0bc103cf41c8f97c0e0
  LUAJ_SHA256: 02464b0a6cf90fa404d0b62ebb587b96a38e118420a7adc467c1550f889fa41b

jobs:
  build:
    # only in the public repository (a private copy of this file runs nothing)
    if: github.repository == 'Aisoga/OpenDawngateServer'
    runs-on: windows-2022 # Visual Studio 2022 with its x86 compiler and CMake
    # a numbered release waits for the signing request's manual approval (up to 3 hours, below)
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 240 || 60 }}
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release name (a version tag)
        # a tag v* names the release (and its version); its form is checked before anything is built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+(\.[0-9]+)?$') {
            throw "tag $env:GITHUB_REF_NAME`: a release tag is v<major>.<minor> or v<major>.<minor>.<patch> (e.g. v0.6, v1.0.1)"
          }
          "RELEASE_NAME=$env:GITHUB_REF_NAME" >> $env:GITHUB_ENV

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: RakNet 4.081 (cache)
        id: raknet-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/raknet/RakNet
          key: raknet-${{ env.RAKNET_COMMIT }}

      - name: RakNet 4.081 (download, check, unpack)
        if: steps.raknet-cache.outputs.cache-hit != 'true'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = Join-Path $env:RUNNER_TEMP 'raknet.zip'
          Invoke-WebRequest "https://github.com/facebookarchive/RakNet/archive/$env:RAKNET_COMMIT.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:RAKNET_SHA256) { throw "RakNet archive SHA-256 $got, expected $env:RAKNET_SHA256" }
          $tmp = Join-Path $env:RUNNER_TEMP 'raknet'
          Expand-Archive $zip -DestinationPath $tmp
          New-Item -ItemType Directory -Force tools/raknet | Out-Null
          Move-Item (Join-Path $tmp "RakNet-$env:RAKNET_COMMIT") tools/raknet/RakNet

      - name: Go (format, vet, tests)
        working-directory: server
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $unformatted = gofmt -l .
          if ($unformatted) { $unformatted; throw 'gofmt: the files above are not formatted' }
          go vet ./...
          go test ./...

      - name: Match host (build)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S gms -B gms/build -G "Visual Studio 17 2022" -A Win32 "-DRAKNET_ROOT=$env:GITHUB_WORKSPACE/tools/raknet/RakNet"
          cmake --build gms/build --config Release

      - name: Match host (tests)
        run: |
          # The RakNet loopback session tests fail now and then on a busy machine (about 1 run in 8):
          # one retry, flagged in the run's summary, so a single slow run doesn't turn the build red.
          gms/build/Release/gms_tests.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::warning title=gms_tests::gms_tests failed once and is run again (a known flaky loopback test)'
            gms/build/Release/gms_tests.exe
            if ($LASTEXITCODE -ne 0) { throw 'gms_tests failed twice' }
          }
          $PSNativeCommandUseErrorActionPreference = $true
          gms/build/core/control/Release/dg_control_tests.exe

      - name: Match host Lua (LuaJ check)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force tools/luaj | Out-Null
          $jar = 'tools/luaj/luaj-jse-2.0.3.jar'
          Invoke-WebRequest 'https://repo1.maven.org/maven2/org/luaj/luaj-jse/2.0.3/luaj-jse-2.0.3.jar' -OutFile $jar
          $got = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:LUAJ_SHA256) { throw "LuaJ SHA-256 $got, expected $env:LUAJ_SHA256" }
          python -I re/scripts/bots_lua_check.py --java "$env:JAVA_HOME_21_X64\bin\java.exe" --luaj $jar

      - name: Release zip and Linux archive
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # a tag's build is named after the tag; any other build OpenDawngateServer-<date>-<commit>
          $nameArgs = @()
          if ($env:RELEASE_NAME) { $nameArgs = @('-Name', $env:RELEASE_NAME) }
          powershell -NoProfile -ExecutionPolicy Bypass -File re/scripts/make_release.ps1 @nameArgs
          $zip = @(Get-ChildItem re/out/release -Filter '*.zip')
          if ($zip.Count -ne 1) { throw "expected one release zip, found $($zip.Count)" }
          $tgz = @(Get-ChildItem re/out/release -Filter '*-linux.tar.gz')
          if ($tgz.Count -ne 1) { throw "expected one Linux archive, found $($tgz.Count)" }
          if ($env:RELEASE_NAME -and $zip[0].Name -cne "$env:RELEASE_NAME.zip") { throw "the zip is $($zip[0].Name), not $env:RELEASE_NAME.zip" }
          "RELEASE_ZIP=$($zip[0].FullName)" >> $env:GITHUB_ENV
          "RELEASE_TGZ=$($tgz[0].FullName)" >> $env:GITHUB_ENV

      # Code signing (README.md *Code signing policy*): a numbered release's Start-Server.exe, Start-Client.exe and
      # host\dgsim.dll go to SignPath as a workflow artifact of this run (its origin check: built here, on GitHub's
      # runners), which signs them once an approver approves the request (by hand, within 3 hours). The release is
      # then built again with the signed files: make_release.ps1 -SignedFiles checks that each is this build's file
      # plus a valid signature, and BUILD.txt lists the signed files (Start-Client's update checks them). Runs only
      # with the repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN set
      # (SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG when they differ from the defaults below).
      - name: Files to sign
        id: to-sign
        if: env.RELEASE_NAME != '' && vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          $d = "re/out/release/$env:RELEASE_NAME"
          New-Item -ItemType Directory -Force re/out/to-sign | Out-Null
          Copy-Item "$d/Start-Server.exe", "$d/Start-Client.exe", "$d/host/dgsim.dll" re/out/to-sign
          Get-ChildItem re/out/to-sign

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-unsigned
        if: steps.to-sign.outcome == 'success'
        with:
          name: to-sign
          path: re/out/to-sign/
          if-no-files-found: error
          retention-days: 1

      - uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        if: steps.to-sign.outcome == 'success'
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'OpenDawngateServer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.RELEASE_NAME }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: re/out/signed

      - name: Release with the signed files
        id: signed
        if: steps.to-sign.outcome == 'success'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # the signed artifact as files (unpacked here if it came as a zip)
          if (-not (Get-ChildItem re/out/signed -Recurse -Filter 'Start-Client.exe')) {
            Get-ChildItem re/out/signed -Filter '*.zip' | ForEach-Object { Expand-Archive $_.FullName -DestinationPath re/out/signed/unzipped }
          }
          Remove-Item -Recurse -Force re/out/release
          powershell -NoProfile -ExecutionPolicy Bypass -File re/scripts/make_release.ps1 -Name $env:RELEASE_NAME -SignedFiles re/out/signed
          $zip = @(Get-ChildItem re/out/release -Filter '*.zip')
          $tgz = @(Get-ChildItem re/out/release -Filter '*-linux.tar.gz')
          if ($zip.Count -ne 1 -or $tgz.Count -ne 1) { throw "expected one release zip and one Linux archive" }
          if ($zip[0].Name -cne "$env:RELEASE_NAME.zip") { throw "the zip is $($zip[0].Name), not $env:RELEASE_NAME.zip" }
          "RELEASE_ZIP=$($zip[0].FullName)" >> $env:GITHUB_ENV
          "RELEASE_TGZ=$($tgz[0].FullName)" >> $env:GITHUB_ENV
          "signed=true" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_TGZ }}
          if-no-files-found: error
          retention-days: 14

  linux:
    # the server's Go code on Linux: format, vet, tests, and the Linux programs
    # (Start-Client stays Windows-only: it starts the Windows game)
    if: github.repository == 'Aisoga/OpenDawngateServer'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Go (format, vet, tests)
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo '::error::gofmt: the files above are not formatted'; exit 1; fi
          go vet ./...
          go test ./...

      - name: Linux programs (build)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/linux-amd64"
          go build -trimpath -ldflags '-s -w' -o "$out/" ./cmd/dgserver ./cmd/start-server
          ls -l "$out"

  linux-release:
    # the Linux archive the Windows job built: one top folder, owner 0:0, the modes and the files
    # of the layout, LF texts, every file's SHA-256 as BUILD.txt lists it, and start-server runs
    # here with the release's version
    needs: build
    if: github.repository == 'Aisoga/OpenDawngateServer'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Linux archive (layout, modes, start-server)
        run: |
          set -euo pipefail
          zip=$(ls release/*.zip)
          tgz=$(ls release/*-linux.tar.gz)
          name=$(basename "$zip" .zip)
          if [ "$(basename "$tgz")" != "$name-linux.tar.gz" ]; then echo "::error::$tgz is not $name-linux.tar.gz"; exit 1; fi
          tar -tvzf "$tgz" --numeric-owner > listing.txt
          grep -v '/host/lua/' listing.txt
          echo "$(grep -c '/host/lua/.*\.lua$' listing.txt) Lua scripts in host/lua"
          awk -v top="$name-linux/" '
            { mode = $1; own = $2; path = $NF
              if (own != "0/0") { print "::error::owner " own ": " path; bad = 1 }
              if (index(path, top) != 1) { print "::error::outside " top ": " path; bad = 1; next }
              rel = substr(path, length(top) + 1)
              if (mode ~ /^d/) want = "drwxr-xr-x"; else if (rel == "start-server") want = "-rwxr-xr-x"; else want = "-rw-r--r--"
              if (mode != want) { print "::error::mode " mode " (not " want "): " path; bad = 1 }
              if (mode !~ /^d/ && rel !~ /^(start-server|dawngate\.service|README\.txt|LICENSE\.txt|THIRD-PARTY-NOTICES\.txt|BUILD\.txt|maps\/README\.txt|host\/dgsim\.dll|host\/lua\/[A-Za-z0-9_]+\.lua)$/) { print "::error::not a file of the layout: " path; bad = 1 }
            }
            END { exit bad }' listing.txt
          mkdir unpacked
          tar xzf "$tgz" -C unpacked --strip-components=1
          cd unpacked
          version=$(./start-server --version)
          if [ "$version" != "$name" ]; then echo "::error::start-server --version says $version, not $name"; exit 1; fi
          sed -n '/^SHA-256 of the files:$/,$p' BUILD.txt | tail -n +2 | sha256sum -c --quiet
          for f in README.txt dawngate.service LICENSE.txt THIRD-PARTY-NOTICES.txt BUILD.txt maps/README.txt; do
            if grep -q $'\r' "$f"; then echo "::error::$f has CR line ends"; exit 1; fi
          done
          echo "the Linux archive of $name: layout, modes and owner as specified, start-server $version"

  nightly:
    # a build of main (a push or the weekly run) replaces the rolling pre-release,
    # only when the Linux jobs passed too
    needs: [build, linux, linux-release]
    if: github.repository == 'Aisoga/OpenDawngateServer' && github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Replace the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zip=$(ls release/*.zip)
          tgz=$(ls release/*-linux.tar.gz)
          gh release delete nightly --repo "$REPO" --cleanup-tag --yes || true
          cat > notes.md <<EOF
          An automatic build of commit ${SHA}, made by this repository's build workflow.

          - Unsigned and not tested in the game: the stable versions are the numbered releases ([Code signing policy](https://github.com/${REPO}#code-signing-policy)).
          - Like every release it contains no game file: put your own \`Dawngate.zip\` (archive.org) next to \`Start-Server.exe\`.
          - The \`-linux.tar.gz\` archive is the same server for a 64-bit Linux machine (\`start-server\`, its match hosts under Wine); players use the zip's \`Start-Client.exe\`.
          - \`BUILD.txt\` in each archive names the commit it was built from (the source, AGPL-3.0).

          This pre-release is replaced by the next build.
          EOF
          gh release create nightly "$zip" "$tgz" --repo "$REPO" --target "$SHA" --prerelease --latest=false \
            --title "Nightly build $(date -u +%Y-%m-%d) (${SHA:0:10})" --notes-file notes.md

  release:
    # a pushed version tag (v<major>.<minor>[.<patch>], checked by the build job) on a commit of main
    # publishes the numbered release: the tag's name as its title and its files' names, not a pre-release,
    # marked Latest by GitHub's rule (the newest version); nothing is replaced or deleted
    needs: [build, linux, linux-release]
    if: github.repository == 'Aisoga/OpenDawngateServer' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          policy="[Code signing policy](https://github.com/${REPO}#code-signing-policy)"
          if [ "$SIGNED" = true ]; then
            signing="- The Windows programs are signed: free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org) (${policy})."
          else
            signing="- The programs are unsigned (SmartScreen: *More info*, *Run anyway*; ${policy})."
          fi
          zip="release/$TAG.zip"
          tgz="release/$TAG-linux.tar.gz"
          ls -l "$zip" "$tgz"
          # the tag must be on main: a release is built only from the published history
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::tag $TAG ($SHA) is not on main (compare: $status); push main first, then the tag"; exit 1
          fi
          cat > notes.md <<NOTES
          OpenDawngateServer ${TAG}, built by this repository's build workflow from commit ${SHA}.

          - \`${TAG}.zip\`: Windows 10/11 64-bit. \`Start-Server.exe\` runs a server, \`Start-Client.exe\` plays. Put your own \`Dawngate.zip\` (archive.org) next to \`Start-Server.exe\`; the release contains no game file. See \`README.txt\` in the zip.
          - \`${TAG}-linux.tar.gz\`: the same server for a 64-bit Linux machine (\`start-server\`, its match hosts under Wine).
          - Players and servers play together only on the same release: update both to this one.
          ${signing}
          - \`BUILD.txt\` in each archive names the commit it was built from (the source, AGPL-3.0).
          NOTES
          gh release create "$TAG" "$zip" "$tgz" --repo "$REPO" --verify-tag \
            --title "OpenDawngateServer $TAG" --notes-file notes.md
